<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" role="img" aria-label="ZZINGONG AI brand sheet">
  <defs>
    <linearGradient id="gA" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#4338CA"/>
    </linearGradient>

    <g id="markBolt">
      <rect width="96" height="96" rx="22" fill="url(#gA)"/>
      <circle cx="48" cy="48" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"/>
      <path d="M48 20A28 28 0 1 1 21.37 56.65" fill="none" stroke="#22D3EE" stroke-width="7" stroke-linecap="round"/>
      <path d="M54 26L36 52H46L42 70L60 44H50Z" fill="#FFFFFF"/>
    </g>
    <g id="markBoltDark">
      <rect width="96" height="96" rx="22" fill="url(#gB)"/>
      <circle cx="48" cy="48" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"/>
      <path d="M48 20A28 28 0 1 1 21.37 56.65" fill="none" stroke="#22D3EE" stroke-width="7" stroke-linecap="round"/>
      <path d="M54 26L36 52H46L42 70L60 44H50Z" fill="#FFFFFF"/>
    </g>
    <g id="markZZ">
      <rect width="96" height="96" rx="22" fill="url(#gA)"/>
      <circle cx="48" cy="48" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"/>
      <path d="M48 20A28 28 0 1 1 21.37 56.65" fill="none" stroke="#22D3EE" stroke-width="7" stroke-linecap="round"/>
      <path d="M36 33H60L36 47H60L36 61H60" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="wmName" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0H30L0 40H30"/>
      <path d="M46 0H76L46 40H76"/>
      <path d="M92 0V40"/>
      <path d="M108 40V0L138 40V0"/>
      <path d="M189.3 7.14A20 20 0 1 0 194 20H180"/>
      <circle cx="230" cy="20" r="20"/>
      <path d="M266 40V0L296 40V0"/>
      <path d="M347.3 7.14A20 20 0 1 0 352 20H338"/>
    </g>
    <g id="wmAI" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M386 40L401 0L416 40"/>
      <path d="M392.4 23H409.6"/>
      <path d="M432 0V40"/>
    </g>
  </defs>

  <rect width="1040" height="720" fill="#F8FAFC"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">

    <text x="56" y="58" font-size="28" font-weight="700" fill="#0F172A">ZZINGONG AI</text>
    <text x="56" y="84" font-size="15" fill="#64748B">찐공AI — 딴짓 빼고 재는 진짜 순공시간</text>

    <g font-size="11" font-weight="700" letter-spacing="1.4" fill="#94A3B8">
      <text x="56" y="126">PRIMARY · LIGHT</text>
      <text x="540" y="126">PRIMARY · DARK</text>
      <text x="56" y="290">APP ICON · BOLT (추천)</text>
      <text x="540" y="290">APP ICON · ZZ (대안)</text>
      <text x="56" y="500">STACKED</text>
      <text x="540" y="500">PALETTE</text>
    </g>

    <!-- primary light -->
    <g transform="translate(56 140) scale(0.78)">
      <use href="#markBolt"/>
      <g transform="translate(128 28)">
        <use href="#wmName" color="#0F172A"/><use href="#wmAI" color="#4F46E5"/>
      </g>
    </g>

    <!-- primary dark -->
    <rect x="540" y="136" width="444" height="96" rx="14" fill="#0B1020"/>
    <g transform="translate(590.5 155.2) scale(0.6)">
      <use href="#markBoltDark"/>
      <g transform="translate(128 28)">
        <use href="#wmName" color="#FFFFFF"/><use href="#wmAI" color="#22D3EE"/>
      </g>
    </g>

    <!-- icon: bolt, size ladder -->
    <use href="#markBolt" transform="translate(56 300)"/>
    <use href="#markBolt" transform="translate(172 348) scale(0.5)"/>
    <use href="#markBolt" transform="translate(240 364) scale(0.3333)"/>
    <use href="#markBolt" transform="translate(292 372) scale(0.25)"/>
    <g font-size="11" fill="#94A3B8">
      <text x="56" y="414">96</text><text x="172" y="414">48</text>
      <text x="240" y="414">32</text><text x="292" y="414">24</text>
    </g>

    <!-- icon: zz, size ladder -->
    <use href="#markZZ" transform="translate(540 300)"/>
    <use href="#markZZ" transform="translate(656 348) scale(0.5)"/>
    <use href="#markZZ" transform="translate(724 364) scale(0.3333)"/>
    <use href="#markZZ" transform="translate(776 372) scale(0.25)"/>
    <g font-size="11" fill="#94A3B8">
      <text x="540" y="414">96</text><text x="656" y="414">48</text>
      <text x="724" y="414">32</text><text x="776" y="414">24</text>
    </g>

    <!-- stacked -->
    <g transform="translate(56 512) scale(0.9)">
      <use href="#markBolt" transform="translate(122 8)"/>
      <g transform="translate(8 124) scale(0.75)">
        <use href="#wmName" color="#0F172A"/><use href="#wmAI" color="#4F46E5"/>
      </g>
    </g>

    <!-- palette -->
    <g>
      <rect x="540" y="512" width="100" height="100" rx="14" fill="#6366F1"/>
      <rect x="652" y="512" width="100" height="100" rx="14" fill="#312E81"/>
      <rect x="764" y="512" width="100" height="100" rx="14" fill="#22D3EE"/>
      <rect x="876" y="512" width="100" height="100" rx="14" fill="#0F172A"/>
      <g font-size="12" font-weight="600" fill="#0F172A">
        <text x="540" y="634">#6366F1</text><text x="652" y="634">#312E81</text>
        <text x="764" y="634">#22D3EE</text><text x="876" y="634">#0F172A</text>
      </g>
      <g font-size="11" fill="#94A3B8">
        <text x="540" y="652">Indigo</text><text x="652" y="652">Indigo Deep</text>
        <text x="764" y="652">Cyan · 순공</text><text x="876" y="652">Ink</text>
      </g>
    </g>
  </g>
</svg>
